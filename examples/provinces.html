<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://unpkg.com/d3@7"></script>
    <script src="https://unpkg.com/topojson@3"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .container {
        position: relative;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 20px;
        max-width: 900px;
        width: 100%;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .province {
        fill: #cd5c5c;
        stroke: white;
        stroke-width: 1;
        opacity: 0.88;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .province:hover {
        opacity: 1;
        fill: #dc143c;
        stroke-width: 1.5;
      }

      .tooltip {
        position: absolute;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        max-width: 300px;
      }

      .tooltip.visible {
        opacity: 1;
      }

      .tooltip-name {
        font-weight: 600;
        margin-bottom: 4px;
      }

      .tooltip-id {
        font-size: 12px;
        opacity: 0.8;
      }

      .osm-credits {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #e0e0e0;
        text-align: center;
        font-size: 11px;
        color: #666;
      }

      .osm-credits a {
        color: #0078a8;
        text-decoration: none;
      }

      .osm-credits a:hover {
        text-decoration: underline;
      }

      .error-message {
        color: #d32f2f;
        text-align: center;
        padding: 20px;
        font-size: 16px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 16px;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 1.8rem;
        }

        .header p {
          font-size: 0.95rem;
        }

        .container {
          padding: 15px;
        }
      }
    </style>

    <title>Morocco Provinces Map - Interactive Visualization</title>
  </head>
  <body>
    <div class="header">
      <h1>🇲🇦 Morocco Provinces</h1>
      <p>Interactive map of Moroccan provinces and prefectures</p>
    </div>

    <div class="container">
      <div id="map-container">
        <div class="loading">Loading map data...</div>
      </div>
      <div class="tooltip"></div>
      <div class="osm-credits">
        © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
        | Data available under ODbL
      </div>
    </div>

    <script src="provinces.js"></script>
  </body>
</html>
